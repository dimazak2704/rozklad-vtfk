# Розклад ВТФК — локальний стенд.
#   docker compose -f infra/docker-compose.yml --profile infra up -d          # postgres, rabbitmq, redis
#   docker compose -f infra/docker-compose.yml --profile app up -d --build    # + усі сервіси, auth та web
# Перед --profile app зберіть jar-и: mvn -q -DskipTests package (Dockerfile копіює target/app.jar).
# Секрети (TELEGRAM_*, ANTHROPIC_API_KEY, *_CLIENT_SECRET) беруться з ../.env, якщо він є.
# Порти опубліковано лише на 127.0.0.1: стенд має справжній токен бота й публічні dev-паролі (rozklad/rozklad,
# postgres/postgres, Redis без пароля), тож у спільній Wi-Fi мережі він не має бути видним.
name: rozklad

x-java-env: &java-env
  DB_HOST: postgres
  DB_PORT: "5432"
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: "5672"
  RABBIT_USER: rozklad
  RABBIT_PASSWORD: rozklad
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # токени видає сервіс входу auth з issuer http://localhost:8088/auth (так його бачить браузер через nginx),
  # а ключі й сервісні токени сервіси беруть напряму в мережі контейнерів; кожен токен має aud rozklad-api
  AUTH_ISSUER: http://localhost:8088/auth
  AUTH_JWKS_URI: http://auth:8085/auth/oauth2/jwks
  AUTH_AUDIENCE: rozklad-api
  AUTH_TOKEN_URI: http://auth:8085/auth/oauth2/token
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

x-java-service: &java-service
  restart: unless-stopped
  profiles: [app]
  env_file:
    - path: ../.env
      required: false

services:
  postgres:
    image: postgres:18-alpine
    profiles: [infra, app]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18: том монтується на /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # під час init сервер слухає лише unix-сокет, тож TCP-перевірка проходить тільки після створення баз
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    profiles: [infra, app]
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rozklad
      RABBITMQ_DEFAULT_PASS: rozklad
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8.8-alpine
    profiles: [infra, app]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Сервіс входу: OIDC-провайдер (Spring Authorization Server), сторінка входу /auth/login.
  # Браузер бачить його лише через nginx контейнера web (http://localhost:8088/auth); 8085 опубліковано лише
  # на 127.0.0.1 для сервісів, запущених на хості. Actuator — на 8086, лише для healthcheck.
  auth:
    <<: *java-service
    build: ../services/auth
    image: rozklad/auth:dev
    env_file:
      - path: ../.env
        required: false
      # демо-акаунти admin / krentsin / nepyivoda (лише розробка)
      - path: ./dev/demo-users.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth
      DB_USER: auth
      DB_PASSWORD: auth
      # видавець фіксований: так його бачить браузер через nginx (web/nginx.conf, location /auth/)
      AUTH_ISSUER: http://localhost:8088/auth
      PUBLIC_WEB_URL: http://localhost:8088
      AUTH_WEB_ORIGINS: http://localhost:5180,http://localhost:5181,http://localhost:8088
      AUTH_CORS_ORIGINS: http://localhost:5180,http://localhost:5181
      AUTH_CLI_ENABLED: "true"
      AUTH_DEMO_SEED: "true"
      # строк access token-а SPA; коротший (2m) — для перевірки тихого оновлення (docs/RUNNING.md, e2e-real)
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      # dev-секрети сервісних клієнтів (ті самі, що в .env.example); environment перекриває ../.env
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:-dev-notification-secret}
      IMPORTER_CLIENT_SECRET: ${IMPORTER_CLIENT_SECRET:-dev-importer-secret}
      CORE_AUTH_CLIENT_SECRET: ${CORE_AUTH_CLIENT_SECRET:-dev-core-auth-secret}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # X-Forwarded-* приймаються лише від контейнерів (nginx web, у prod — Caddy): діапазон ip_range мережі
      # default нижче. Шлюз мережі (172.29.0.1), через який приходять з'єднання на опубліковані порти, у нього
      # не входить, тож клієнт з хоста не підставить собі IP для блокування входу
      AUTH_TRUSTED_PROXIES: 172.29.1.0/24
      JAVA_TOOL_OPTIONS: -Xmx${AUTH_HEAP:-256m}
    mem_limit: ${AUTH_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  core:
    <<: *java-service
    build: ../services/core
    image: rozklad/core:dev
    environment:
      <<: *java-env
      DB_NAME: core
      DB_USER: core
      DB_PASSWORD: core
      PUBLIC_WEB_URL: http://localhost:8088
      # облікові записи — у сервісі входу auth (внутрішній API лише в мережі контейнерів);
      # dev-секрет клієнта rozklad-core той самий, що в сервісі auth; environment перекриває ../.env,
      # тому значення з оболонки підставляє інтерполяція (${VAR:-dev})
      AUTH_INTERNAL_URL: http://auth:8085/auth/internal
      CORE_AUTH_CLIENT_SECRET: ${CORE_AUTH_CLIENT_SECRET:-dev-core-auth-secret}
      # -Xmx у JAVA_TOOL_OPTIONS перекриває -XX:MaxRAMPercentage=75 з ENTRYPOINT образу
      # «машина часу» стенду (StandClock): scripts/dev-stack.sh up --time 2026-11-20T10:00; порожньо — реальний час
      ROZKLAD_STAND_TIME: ${ROZKLAD_STAND_TIME:-}
      ROZKLAD_STAND_TIME_ANCHOR: ${ROZKLAD_STAND_TIME_ANCHOR:-}
      JAVA_TOOL_OPTIONS: -Xmx${CORE_HEAP:-512m}
    mem_limit: ${CORE_MEM_LIMIT:-900m}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck: &java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  scheduler:
    <<: *java-service
    build: ../services/scheduler
    image: rozklad/scheduler:dev
    environment:
      <<: *java-env
      DB_NAME: scheduler
      DB_USER: scheduler
      DB_PASSWORD: scheduler
      JAVA_TOOL_OPTIONS: -Xmx${SCHEDULER_HEAP:-512m}
    mem_limit: ${SCHEDULER_MEM_LIMIT:-900m}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  importer:
    <<: *java-service
    build: ../services/importer
    image: rozklad/importer:dev
    environment:
      <<: *java-env
      DB_NAME: importer
      DB_USER: importer
      DB_PASSWORD: importer
      CORE_URL: http://core:8081
      IMPORTER_CLIENT_SECRET: ${IMPORTER_CLIENT_SECRET:-dev-importer-secret}
      # «машина часу» стенду (StandClock): scripts/dev-stack.sh up --time 2026-11-20T10:00; порожньо — реальний час
      ROZKLAD_STAND_TIME: ${ROZKLAD_STAND_TIME:-}
      ROZKLAD_STAND_TIME_ANCHOR: ${ROZKLAD_STAND_TIME_ANCHOR:-}
      # LibreOffice працює в тому ж контейнері поруч із JVM, тому купа менша за ліміт
      JAVA_TOOL_OPTIONS: -Xmx${IMPORTER_HEAP:-384m}
    mem_limit: ${IMPORTER_MEM_LIMIT:-900m}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_started
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  notification:
    <<: *java-service
    build: ../services/notification
    image: rozklad/notification:dev
    environment:
      <<: *java-env
      DB_NAME: notification
      DB_USER: notification
      DB_PASSWORD: notification
      CORE_URL: http://core:8081
      IMPORTER_URL: http://importer:8083
      PUBLIC_WEB_URL: http://localhost:8088
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:-dev-notification-secret}
      # «машина часу» стенду (StandClock): scripts/dev-stack.sh up --time 2026-11-20T10:00; порожньо — реальний час
      ROZKLAD_STAND_TIME: ${ROZKLAD_STAND_TIME:-}
      ROZKLAD_STAND_TIME_ANCHOR: ${ROZKLAD_STAND_TIME_ANCHOR:-}
      JAVA_TOOL_OPTIONS: -Xmx${NOTIFICATION_HEAP:-384m}
    mem_limit: ${NOTIFICATION_MEM_LIMIT:-900m}
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_started
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  gateway:
    <<: *java-service
    build: ../services/gateway
    image: rozklad/gateway:dev
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORE_URL: http://core:8081
      SCHEDULER_URL: http://scheduler:8082
      IMPORTER_URL: http://importer:8083
      NOTIFICATION_URL: http://notification:8084
      CORS_ALLOWED_ORIGINS: http://localhost:5180,http://localhost:8088
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      JAVA_TOOL_OPTIONS: -Xmx${GATEWAY_HEAP:-256m}
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  web:
    # Dockerfile пише агент web/: nginx віддає SPA; порт у контейнері — WEB_CONTAINER_PORT (типово 80)
    profiles: [app]
    restart: unless-stopped
    build: ../web
    image: rozklad/web:dev
    # вхід — на тому ж походженні: SPA бере видавця ${origin}/auth (VITE_OIDC_AUTHORITY порожній).
    # Лише 127.0.0.1; WEB_BIND_ADDRESS=0.0.0.0 свідомо відкриває сайт у локальну мережу (вхід там не працює:
    # видавець — http://localhost:8088/auth)
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8088:${WEB_CONTAINER_PORT:-80}"
    depends_on:
      gateway:
        condition: service_started
      auth:
        condition: service_started

# Фіксована мережа: контейнери отримують адреси лише з ip_range, а шлюз лишається поза ним
# (AUTH_TRUSTED_PROXIES сервісу auth довіряє саме ip_range)
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16
          ip_range: 172.29.1.0/24
          gateway: 172.29.0.1

volumes:
  pgdata:
  rabbitdata:
  redisdata:
