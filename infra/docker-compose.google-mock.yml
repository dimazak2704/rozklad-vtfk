# Накладка для локального стенду: «Google» без Google — mock-oauth2-server (DESIGN §6.1, docs/GOOGLE_SIGNIN.md).
# Лише для розробки; у prod її немає, а auth з https-видавцем відмовиться стартувати з AUTH_GOOGLE_MOCK.
#   scripts/dev-stack.sh up --google-mock
# На сторінці входу mock-сервера вкажіть будь-яке ім'я (стане sub) і claims, наприклад
#   {"email":"krentsin@rozklad.local"}            — демо-викладач (домен не перевіряється)
#   {"email":"x@vtc.vn.ua","hd":"vtc.vn.ua"}      — перевірка правила домену з AUTH_GOOGLE_HOSTED_DOMAIN=vtc.vn.ua
# Браузер ходить на mock через localhost:8090, контейнер auth — через mock-oidc:8090 (зворотний канал).
services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1
    profiles: [app]
    restart: unless-stopped
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG_PATH: /config/mock-oidc.json
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./dev/mock-oidc.json:/config/mock-oidc.json:ro
    mem_limit: 256m

  auth:
    depends_on:
      mock-oidc:
        condition: service_started
    environment:
      AUTH_GOOGLE_MOCK: "true"
      AUTH_GOOGLE_CLIENT_ID: rozklad-dev
      # dev-значення: mock приймає будь-який секрет; ProdGuard не пропустить його в prod
      AUTH_GOOGLE_CLIENT_SECRET: dev-google-secret
      # iss ID token-а mock бере з адреси запиту токена, тобто зворотного каналу
      AUTH_GOOGLE_ISSUER_URI: http://mock-oidc:8090/google
      AUTH_GOOGLE_AUTHORIZATION_URI: http://localhost:8090/google/authorize
      AUTH_GOOGLE_TOKEN_URI: http://mock-oidc:8090/google/token
      AUTH_GOOGLE_JWK_SET_URI: http://mock-oidc:8090/google/jwks
      AUTH_GOOGLE_USER_INFO_URI: http://mock-oidc:8090/google/userinfo
      # порожньо = будь-який домен; GOOGLE_MOCK_HOSTED_DOMAIN=vtc.vn.ua вмикає правило домену
      AUTH_GOOGLE_HOSTED_DOMAIN: ${GOOGLE_MOCK_HOSTED_DOMAIN:-}
