# Production broker settings (compose.prod.yml mounts this into /etc/rabbitmq/conf.d).
#
# The one broker user of the stack (RABBITMQ_DEFAULT_USER) is created without the administrator tag:
# the services need only AMQP, and without a tag the user cannot sign in to the management HTTP API
# (user, permission and definition changes). Operate the broker with `rabbitmqctl` in the container
# (docs/DEPLOY.md, section 11). Applied when the rabbitdata volume is created.
default_user_tags.administrator = false
