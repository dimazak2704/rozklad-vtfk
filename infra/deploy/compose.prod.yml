# Production overlay for one Linux VPS. The service definitions stay in infra/docker-compose.yml;
# this file only changes what production needs. Guide: docs/DEPLOY.md.
#
#   docker compose -f infra/docker-compose.yml -f infra/deploy/compose.prod.yml \
#     --env-file infra/deploy/.env --profile app up -d
#
# infra/deploy/scripts/compose.sh runs exactly that from any directory.
#
# - Only Caddy publishes ports (80/443, TLS from Let's Encrypt). Everything else is reachable only
#   inside the compose network: `ports: !reset []` drops the development port mappings.
# - Every secret comes from infra/deploy/.env (gitignored). `${VAR:?}` stops compose when a required
#   value is missing. `env_file: !reset []` keeps the development ../.env out of the containers.
# - Relative paths are resolved against infra/ (the directory of the first compose file).
# - Needs Docker Compose 2.24.4+ for the !reset tag.
# - Memory: the mem_limit values are caps, not reservations; they add up to about 5.6 GB. A 4 GB VPS
#   with 2 GB of swap is best effort and has not been measured; 8 GB or more is recommended.
#   Bigger values for a 24 GB VM are in .env.example.
# - Images: deploy.sh records the IMAGE_PREFIX/IMAGE_TAG it started in deploy/.env.images, and
#   scripts/lib.sh passes that file after .env, so every later compose call uses the running images.
#   The default prefix localhost/rozklad can never be pulled from Docker Hub by mistake.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Runtime hardening of every container: setuid binaries give no new privileges, and the number of
# processes and threads is bounded (a fork bomb stops at the limit). Checked by
# infra/deploy/tests/config_test.py.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  pids_limit: 1024

# The Java services run as the non-root user app on ports above 1024: they need no capability.
x-java-hardening: &java-hardening
  <<: *hardening
  cap_drop: [ALL]

# Background work (the solver, imports, document conversion) gets half the CPU weight of the database,
# the gateway, auth and Caddy when the CPU is busy; idle CPU is still used in full.
x-background-cpu: &background-cpu
  cpu_shares: 512

# Production values shared by the Java services (they override the dev values of x-java-env). The
# broker and Redis credentials are separate: a service gets only those of a client it has (importer
# has no AMQP client, scheduler no Redis client), so a compromised parser cannot publish bot events.
x-prod-rabbit-env: &prod-rabbit-env
  RABBIT_USER: ${RABBIT_USER:-rozklad}
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:?}

x-prod-redis-env: &prod-redis-env
  # Spring Boot binds SPRING_DATA_REDIS_PASSWORD to spring.data.redis.password
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}

x-prod-java-env: &prod-java-env
  # Browsers get tokens from the sign-in service at https://<domain>/auth, so that is the issuer to
  # validate. Keys and service tokens come from auth inside the network (AUTH_JWKS_URI, AUTH_TOKEN_URI
  # and AUTH_AUDIENCE stay as in the base file).
  AUTH_ISSUER: https://${DOMAIN:?}/auth
  # services are not reachable from the internet; keep their Swagger UI off anyway
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  # --- Edge: TLS termination and routing (the only published ports) -------------------------------
  caddy:
    image: caddy:2.11-alpine
    <<: *hardening
    # root in the container, but with one capability: binding 80/443
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true # certificates and state live in the caddy_data/caddy_config volumes
    tmpfs: [/tmp]
    profiles: [app]
    restart: unless-stopped
    # IPv4 only: the compose network has no IPv6, so docker-proxy would hand Caddy every IPv6 client as
    # the network gateway (one shared rate-limit bucket and sign-in throttle). No AAAA record either.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp" # HTTP/3; browsers fall back to TCP if the cloud firewall blocks UDP
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      WEB_UPSTREAM: web:${WEB_CONTAINER_PORT:-80}
    volumes:
      # the directory, not the file: a single-file bind mount keeps the old inode after git pull
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data # certificates and ACME account: keep this volume
      - caddy_config:/config
    healthcheck:
      # admin API listens on localhost inside the container only
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    logging: *logging

  # --- Data ------------------------------------------------------------------------------------------
  postgres:
    <<: *hardening
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # read once by 20-prod-passwords.sh when the data volume is initialised
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?}
      IMPORTER_DB_PASSWORD: ${IMPORTER_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
    volumes:
      # runs after 10-init.sql and replaces its development passwords
      - ./deploy/postgres/20-prod-passwords.sh:/docker-entrypoint-initdb.d/20-prod-passwords.sh:ro
    shm_size: 128m
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    logging: *logging

  rabbitmq:
    <<: *hardening
    ports: !reset []
    environment:
      # applied when the rabbitdata volume is created
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-rozklad}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?}
    volumes:
      # the user above without the administrator tag (no management API); also applied at volume creation
      - ./deploy/rabbitmq/20-rozklad.conf:/etc/rabbitmq/conf.d/20-rozklad.conf:ro
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    logging: *logging

  redis:
    <<: *hardening
    ports: !reset []
    # volatile-lru evicts only keys with a TTL (caches, rate limits), never state without one
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}",
              "--maxmemory", "${REDIS_MAXMEMORY:-96mb}", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?} # lets the healthcheck's redis-cli authenticate
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    mem_limit: ${REDIS_MEM_LIMIT:-160m}
    logging: *logging

  # --- Sign-in service (services/auth; Caddy serves it at https://<domain>/auth) ---------------------
  auth:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/auth:${IMAGE_TAG:-prod}
    <<: *java-hardening
    env_file: !reset [] # also drops the development demo passwords of infra/dev/demo-users.env
    ports: !reset []
    environment:
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      # one fixed issuer; with https the service refuses development settings at startup (ProdGuard)
      AUTH_ISSUER: https://${DOMAIN:?}/auth
      PUBLIC_WEB_URL: https://${DOMAIN:?}
      AUTH_WEB_ORIGINS: https://${DOMAIN:?}
      # the SPA is on the same origin: no CORS
      AUTH_CORS_ORIGINS: ""
      # rozklad-cli (scripts) only for a one-off run on the server: auth refuses an https issuer with it
      # unless AUTH_CLI_ALLOW_PROD is set too, and warns at every start; switch both off afterwards
      AUTH_CLI_ENABLED: ${AUTH_CLI_ENABLED:-false}
      AUTH_CLI_ALLOW_PROD: ${AUTH_CLI_ALLOW_PROD:-false}
      AUTH_DEMO_SEED: "false"
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-5m}
      AUTH_SESSION_IDLE: ${AUTH_SESSION_IDLE:-1h}
      AUTH_SESSION_MAX: ${AUTH_SESSION_MAX:-10h}
      AUTH_LOCKOUT_MAX_FAILURES: ${AUTH_LOCKOUT_MAX_FAILURES:-5}
      # AUTH_TRUSTED_PROXIES stays as in the base file (the ip_range of the compose network, so Caddy and
      # not the network gateway): auth takes the client IP of its lockout from Caddy's X-Forwarded-For only
      AUTH_COOKIE_NAME: __Secure-RZ_AUTH
      AUTH_COOKIE_SECURE: "true"
      AUTH_TEMPLATE_CACHE: "true"
      # PKCS#8 PEM made by gen-secrets.sh; a new key only makes the services fetch the JWKS again
      AUTH_SIGNING_KEY_FILE: /run/secrets/auth-signing-key.pem
      AUTH_SIGNING_KEY_ID: ${AUTH_SIGNING_KEY_ID:?}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?}
      IMPORTER_CLIENT_SECRET: ${IMPORTER_CLIENT_SECRET:?}
      CORE_AUTH_CLIENT_SECRET: ${CORE_AUTH_CLIENT_SECRET:?}
      # the first admin; applied only while no admin can sign in (docs/DEPLOY.md, "First admin")
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      AUTH_BOOTSTRAP_FORCE: ${AUTH_BOOTSTRAP_FORCE:-false}
      # demo teachers krentsin and nepyivoda for the defense; empty = off
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_HOSTED_DOMAIN: ${AUTH_GOOGLE_HOSTED_DOMAIN:-}
      JAVA_TOOL_OPTIONS: -Xmx${AUTH_HEAP:-256m}
    volumes:
      # one file, mode 644 inside the 700 directory infra/deploy/secrets (the container user reads it)
      - ./deploy/secrets/auth-signing-key.pem:/run/secrets/auth-signing-key.pem:ro
    stop_grace_period: 30s
    mem_limit: ${AUTH_MEM_LIMIT:-512m}
    logging: *logging

  # --- Application services ---------------------------------------------------------------------------
  core:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/core:${IMAGE_TAG:-prod}
    <<: *java-hardening
    env_file: !reset []
    ports: !reset []
    environment:
      <<: [*prod-java-env, *prod-rabbit-env, *prod-redis-env]
      DB_PASSWORD: ${CORE_DB_PASSWORD:?}
      PUBLIC_WEB_URL: https://${DOMAIN:?}
      # accounts live in the sign-in service auth (internal API on the container network only)
      AUTH_INTERNAL_URL: http://auth:8085/auth/internal
      AUTH_TOKEN_URI: http://auth:8085/auth/oauth2/token
      CORE_AUTH_CLIENT_SECRET: ${CORE_AUTH_CLIENT_SECRET:?}
      # -Xmx in JAVA_TOOL_OPTIONS wins over -XX:MaxRAMPercentage=75 of the image entrypoint
      JAVA_TOOL_OPTIONS: -Xmx${CORE_HEAP:-384m}
    stop_grace_period: 30s
    mem_limit: ${CORE_MEM_LIMIT:-768m}
    logging: *logging

  scheduler:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/scheduler:${IMAGE_TAG:-prod}
    <<: [*java-hardening, *background-cpu]
    env_file: !reset []
    ports: !reset []
    environment:
      <<: [*prod-java-env, *prod-rabbit-env]
      DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?}
      JAVA_TOOL_OPTIONS: -Xmx${SCHEDULER_HEAP:-384m}
    stop_grace_period: 30s
    mem_limit: ${SCHEDULER_MEM_LIMIT:-768m}
    logging: *logging

  importer:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/importer:${IMAGE_TAG:-prod}
    <<: [*java-hardening, *background-cpu]
    env_file: !reset []
    ports: !reset []
    environment:
      <<: [*prod-java-env, *prod-redis-env]
      # no AMQP client: drop the broker account of the base file's x-java-env
      RABBIT_USER: !reset null
      RABBIT_PASSWORD: !reset null
      DB_PASSWORD: ${IMPORTER_DB_PASSWORD:?}
      IMPORTER_CLIENT_SECRET: ${IMPORTER_CLIENT_SECRET:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_TEXT: ${AI_MODEL_TEXT:-claude-haiku-5-5}
      AI_MODEL_VISION: ${AI_MODEL_VISION:-claude-sonnet-5-5}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-2.00}
      # heap below the limit: rendering PDF pages for the AI also uses native memory
      JAVA_TOOL_OPTIONS: -Xmx${IMPORTER_HEAP:-320m}
    stop_grace_period: 30s
    mem_limit: ${IMPORTER_MEM_LIMIT:-896m}
    logging: *logging

  notification:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/notification:${IMAGE_TAG:-prod}
    <<: [*java-hardening, *background-cpu]
    env_file: !reset []
    ports: !reset []
    environment:
      <<: [*prod-java-env, *prod-rabbit-env, *prod-redis-env]
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?}
      PUBLIC_WEB_URL: https://${DOMAIN:?}
      # one bot token = one polling instance: stop the local bot before starting this one
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-scheduler_vtfk_bot}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-POLLING}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # WEBHOOK mode registers this URL with Telegram (Caddy routes /api/* through the gateway)
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://${DOMAIN:?}/api/notify/telegram/webhook}
      # small heap on purpose: LibreOffice runs in the same container next to the JVM
      JAVA_TOOL_OPTIONS: -Xmx${NOTIFICATION_HEAP:-320m}
    stop_grace_period: 30s
    mem_limit: ${NOTIFICATION_MEM_LIMIT:-896m}
    logging: *logging

  gateway:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/gateway:${IMAGE_TAG:-prod}
    <<: *java-hardening
    env_file: !reset []
    ports: !reset []
    environment:
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # the SPA is same-origin with /api and /auth
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?}
      PUBLIC_RATE_LIMIT_PER_SECOND: ${PUBLIC_RATE_LIMIT_PER_SECOND:-20}
      PUBLIC_RATE_LIMIT_BURST: ${PUBLIC_RATE_LIMIT_BURST:-40}
      # Only Caddy can reach the gateway. Caddy replaces X-Forwarded-For with the real client address
      # and removes the client's Forwarded / X-Forwarded-Port / -Prefix headers (Caddyfile,
      # strip_client_forwarding), so the per-IP limit of /api/public/** is per browser, not per Caddy.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -Xmx${GATEWAY_HEAP:-256m}
    stop_grace_period: 30s
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    logging: *logging

  # --- SPA (nginx with the Vite build) -----------------------------------------------------------------
  web:
    image: ${IMAGE_PREFIX:-localhost/rozklad}/web:${IMAGE_TAG:-prod}
    <<: *hardening
    # the nginx master runs as root to bind :80 and starts the workers as the user nginx
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/var/cache/nginx, /run, /tmp]
    build:
      # Vite reads VITE_* at build time. No VITE_OIDC_AUTHORITY: the SPA signs in at its own origin
      # (https://<domain>/auth), so one image fits every domain.
      args:
        VITE_API_BASE: /api
        VITE_OIDC_CLIENT_ID: rozklad-web
        VITE_TELEGRAM_BOT_URL: https://t.me/${TELEGRAM_BOT_USERNAME:-scheduler_vtfk_bot}
    environment: !reset {} # the base file's runtime variables are not read by the image
    ports: !reset []
    mem_limit: ${WEB_MEM_LIMIT:-64m}
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
