# SonarCloud analysis of the whole monorepo as one project: the Maven modules (Java) and web/ (TypeScript).
# CI runs it (.github/workflows/ci.yml, job "SonarCloud") after the backend and web jobs, from their
# compiled classes, JaCoCo XML reports (unit + integration tests) and the Vitest lcov report.
# Dashboard: https://sonarcloud.io/project/overview?id=dimazak2704_rozklad-vtfk
sonar.organization=dimazak2704
sonar.projectKey=dimazak2704_rozklad-vtfk
sonar.projectName=Rozklad VTFK
sonar.sourceEncoding=UTF-8

# --- Scope -------------------------------------------------------------------------------------------
sonar.sources=\
  libs/contracts/src/main,\
  services/auth/src/main,\
  services/core/src/main,\
  services/gateway/src/main,\
  services/importer/src/main,\
  services/notification/src/main,\
  services/scheduler/src/main,\
  web/src
sonar.tests=\
  libs/contracts/src/test,\
  services/auth/src/test,\
  services/core/src/test,\
  services/gateway/src/test,\
  services/importer/src/test,\
  services/notification/src/test,\
  services/scheduler/src/test,\
  web/src

# web/src holds both the app and its tests (*.test.ts(x) next to the code): the tests and test helpers
# are test files, the mock API (MSW handlers and fixtures) and the dev-only kitchen sink are not analysed.
# Flyway migrations and demo SQL are data, not code.
sonar.exclusions=\
  **/src/main/resources/db/**,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/test/**,\
  web/src/mocks/**,\
  web/src/pages/dev/**,\
  seed/**,\
  scripts/**,\
  infra/**,\
  docs/**
sonar.test.inclusions=\
  **/src/test/**,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/test/**

# Test code and mocks count neither for duplication nor for coverage
sonar.cpd.exclusions=\
  **/src/test/**,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/test/**,\
  web/src/mocks/**
sonar.coverage.exclusions=\
  **/src/test/**,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/test/**,\
  web/src/mocks/**,\
  web/src/pages/dev/**

# --- Java ----------------------------------------------------------------------------------------------
# sonar.java.libraries (the dependency jars) is passed by CI: it points at the runner's Maven repository.
sonar.java.source=25
sonar.java.binaries=\
  libs/contracts/target/classes,\
  services/auth/target/classes,\
  services/core/target/classes,\
  services/gateway/target/classes,\
  services/importer/target/classes,\
  services/notification/target/classes,\
  services/scheduler/target/classes
sonar.java.test.binaries=\
  libs/contracts/target/test-classes,\
  services/auth/target/test-classes,\
  services/core/target/test-classes,\
  services/gateway/target/test-classes,\
  services/importer/target/test-classes,\
  services/notification/target/test-classes,\
  services/scheduler/target/test-classes

# mvn verify: one report per module covering surefire (*Test) and failsafe (*IT, Testcontainers) runs
sonar.coverage.jacoco.xmlReportPaths=\
  libs/contracts/target/site/jacoco/jacoco.xml,\
  services/auth/target/site/jacoco/jacoco.xml,\
  services/core/target/site/jacoco/jacoco.xml,\
  services/gateway/target/site/jacoco/jacoco.xml,\
  services/importer/target/site/jacoco/jacoco.xml,\
  services/notification/target/site/jacoco/jacoco.xml,\
  services/scheduler/target/site/jacoco/jacoco.xml

# --- TypeScript ----------------------------------------------------------------------------------------
# npm run test:coverage (Vitest, v8 provider)
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# --- Quality gate --------------------------------------------------------------------------------------
# The job waits for the gate and fails when it is red (a required check on main only)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
