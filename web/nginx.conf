# SPA «Розклад ВТФК» у контейнері: статика + проксі /api на gateway.
# Порт 80 у контейнері; у docker compose публікується як 8088 (ARCHITECTURE §1).

# Docker DNS: імʼя gateway резолвимо під час запиту, щоб nginx стартував і без нього
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
    image/svg+xml text/calendar;

  # Безпека. Хеш у script-src — від вбудованого скрипту теми в index.html
  # (тест scripts/csp-hash.test.mjs перевіряє, що він збігається). connect-src/form-action містять Keycloak.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qRoFmikCNcZWusgs2S/EJtUld9ZCFif0PU31XI1xO5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://localhost:8180; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8180; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # REST і SSE через gateway. Буферизацію вимкнено, щоб події /api/events/stream ішли одразу.
  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # імпорт Excel/DOCX/PDF і фото розпоряджень
    client_max_body_size 25m;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Файли з хешем у назві не змінюються — кешуємо назавжди
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Карти коду лишаються в образі для налагодження, але не віддаються назовні
  location ~* \.map$ {
    return 404;
  }

  # index.html завжди свіжий, інакше після оновлення браузер вантажив би старі частини коду
  location = /index.html {
    expires -1;
  }

  # SPA: будь-який невідомий шлях віддає index.html, маршрут розбирає React Router
  location / {
    expires 1h;
    try_files $uri $uri/ /index.html;
  }
}
