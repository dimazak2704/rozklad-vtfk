# SPA «Розклад ВТФК» у контейнері: статика + проксі /api на gateway.
# Порт 80 у контейнері; у docker compose публікується як 8088 (ARCHITECTURE §1).

# Docker DNS: імʼя gateway резолвимо під час запиту, щоб nginx стартував і без нього
resolver 127.0.0.11 valid=30s ipv6=off;

# У production Caddy шле /auth/* сюди (Caddyfile, auth_routes), а не прямо на auth: тут ліміт запитів.
# Caddy — контейнер мережі compose з ip_range 172.29.1.0/24 (infra/docker-compose.yml); він замінює
# X-Forwarded-For адресою клієнта й ставить X-Forwarded-Proto, тож лише йому nginx вірить, хто клієнт.
# У розробці браузер приходить через шлюз мережі 172.29.0.1 (опублікований порт): його X-Forwarded-* ігноруються.
set_real_ip_from 172.29.1.0/24;
real_ip_header X-Forwarded-For;

# 1 — запит прийшов через Caddy (адреса з'єднання, а не клієнта з X-Forwarded-For)
geo $realip_remote_addr $rozklad_via_edge {
  default 0;
  172.29.1.0/24 1;
}

# Схема й порт, які бачив браузер; сервіс входу будує з них адреси (X-Forwarded-Proto, X-Forwarded-Port).
# За Caddy — https і 443. Напряму — схема з'єднання й порт з Host (localhost:8088 → 8088): nginx слухає 80,
# тож $server_port тут неправильний.
map $http_host $rozklad_host_port {
  ~:(?<port>\d+)$ $port;
  default 80;
}
map "$rozklad_via_edge:$http_x_forwarded_proto" $rozklad_forwarded_proto {
  "1:https" https;
  default $scheme;
}
map "$rozklad_via_edge:$http_x_forwarded_proto" $rozklad_forwarded_port {
  "1:https" 443;
  default $rozklad_host_port;
}

# Ліміт сервісу входу на адресу клієнта: кожен анонімний GET /auth/login чи /auth/oauth2/authorize створює
# сесію (рядок у БД auth на годину), тож без ліміту один клієнт заповнив би базу. 5 запитів на секунду
# (вхід — близько 10 запитів), понад це 20 одразу, ще 20 із затримкою, решта — 429. Лише за Caddy: у розробці
# всі запити з хоста мають адресу шлюзу й ділили б один ліміт, а порожній ключ nginx не рахує.
map $rozklad_via_edge $rozklad_auth_limit_key {
  1 $binary_remote_addr;
  default "";
}
limit_req_zone $rozklad_auth_limit_key zone=rozklad_auth:2m rate=5r/s;

# Журнал без секретів. Шлях береться з початкового запиту ($request_uri) без query string: там code, state,
# id_token_hint (/auth/, /login/callback). Одноразові токени посилань /invite/<токен> і /password/<токен>
# у шляху замінено на [token]: core зберігає лише їхній SHA-256, а журнал не має їх розкривати.
# Адреса — з'єднання ($realip_remote_addr), як і досі: за Caddy це сам Caddy, адреси відвідувачів не пишуться.
map $request_uri $rozklad_log_path {
  ~*^/+(?<kind>invite|password)/ /$kind/[token];
  ~^(?<path>[^?]*) $path;
}
log_format rozklad_safe '$realip_remote_addr - $remote_user [$time_local] "$request_method $rozklad_log_path $server_protocol" '
  '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # усі location успадковують журнал без query string і токенів (типовий формат main пише $request повністю)
  access_log /var/log/nginx/access.log rozklad_safe;
  # власні переадресації nginx — відносні: контейнер слухає 80, а браузер приходить на 8088 (або 443 за Caddy)
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
    image/svg+xml text/calendar;

  # Безпека. Хеш у script-src — від вбудованого скрипту теми в index.html
  # (тест scripts/csp-hash.test.mjs перевіряє, що він збігається). font-src з data:, бо Vite вбудовує малі
  # підмножини woff2 у CSS як data: URI. Сервіс входу на тому ж походженні (/auth),
  # тож connect-src, form-action і frame-src (iframe тихого оновлення) — лише 'self'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qRoFmikCNcZWusgs2S/EJtUld9ZCFif0PU31XI1xO5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # REST і SSE через gateway. Буферизацію вимкнено, щоб події /api/events/stream ішли одразу.
  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # імпорт Excel/DOCX/PDF і фото розпоряджень
    client_max_body_size 25m;
  }

  # Сервіс входу (services/auth): сторінка входу, OIDC, JWKS. Шлях іде без змін (/auth/...), бо auth
  # працює з context-path /auth. Внутрішній API (лише для core в мережі контейнерів) назовні не віддаємо.
  location ^~ /auth/internal/ {
    return 404;
  }

  location = /auth {
    return 302 /auth/login;
  }

  location /auth/ {
    # за Caddy: 5 запитів на секунду з адреси клієнта (limit_req_zone вище), понад ліміт — 429 українською
    limit_req zone=rozklad_auth burst=40 delay=20;
    limit_req_status 429;
    error_page 429 @auth_too_many;
    # Журнал помилок nginx пише рядок запиту з query string (code від Google, state), тож відмови ліміту
    # (info) і помилки проксі туди не потрапляють; код відповіді й шлях без query string є в журналі доступу
    limit_req_log_level info;
    error_log stderr crit;
    set $auth http://auth:8085;
    proxy_pass $auth;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $rozklad_forwarded_port;
    proxy_set_header X-Forwarded-Proto $rozklad_forwarded_proto;
    # лише справжня адреса клієнта (від Caddy або з'єднання), без значення, яке надіслав сам клієнт
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    # CSP, X-Frame-Options і Referrer-Policy сторінок входу ставить сам auth. Власний add_header у цьому location
    # вимикає успадкування заголовків server-рівня: друга CSP (сайту) звузила б form-action сторінки входу
    add_header X-Robots-Tag "noindex" always;
  }

  # Відповідь ліміту сервісу входу (limit_req у location /auth/): відповіді самого auth сюди не потрапляють
  location @auth_too_many {
    default_type text/plain;
    charset utf-8;
    add_header Retry-After 5 always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;
    return 429 "Забагато запитів до входу з вашої адреси. Зачекайте кілька секунд і спробуйте ще раз.\n";
  }

  # Сторінка тихого оновлення входу (login/silent.html): її відкриває прихований iframe самого сайту, тому
  # frame-ancestors 'self' замість 'none'. Власний add_header вимикає заголовки server-рівня — повторюємо їх.
  location = /login/silent.html {
    expires -1;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;
    try_files $uri =404;
  }

  # Стилі сторінки входу (src/styles/auth-page.css): фіксована назва, тому завжди перевіряємо свіжість
  location = /brand/auth.css {
    expires -1;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Файли з хешем у назві не змінюються — кешуємо назавжди
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Карти коду лишаються в образі для налагодження, але не віддаються назовні
  location ~* \.map$ {
    return 404;
  }

  # index.html завжди свіжий, інакше після оновлення браузер вантажив би старі частини коду
  location = /index.html {
    expires -1;
  }

  # Service Worker, його реєстрація й маніфест PWA без хешу в назві: браузер має щоразу питати свіжі,
  # інакше після оновлення сайту годину жив би старий воркер зі старою оболонкою
  location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    expires -1;
  }

  # SPA: будь-який невідомий шлях віддає index.html, маршрут розбирає React Router. Без $uri/: каталог
  # dist/login (silent.html) інакше перетворив би маршрут /login на переадресацію 301 на /login/
  location / {
    expires 1h;
    try_files $uri /index.html;
  }
}
