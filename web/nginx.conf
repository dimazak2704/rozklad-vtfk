# SPA «Розклад ВТФК» у контейнері: статика + проксі /api на gateway.
# Порт 80 у контейнері; у docker compose публікується як 8088 (ARCHITECTURE §1).

# Docker DNS: імʼя gateway резолвимо під час запиту, щоб nginx стартував і без нього
resolver 127.0.0.11 valid=30s ipv6=off;

# Порт, який бачив браузер (localhost:8088 → 8088): nginx слухає 80, тож $server_port тут неправильний.
# Сервіс входу будує з нього збережену адресу запиту authorize (X-Forwarded-Port).
map $http_host $rozklad_forwarded_port {
  ~:(?<port>\d+)$ $port;
  default 80;
}

# Журнал /auth/ без query string: там code, state, id_token_hint
log_format rozklad_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
  '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # власні переадресації nginx — відносні: контейнер слухає 80, а браузер приходить на 8088 (або 443 за Caddy)
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
    image/svg+xml text/calendar;

  # Безпека. Хеш у script-src — від вбудованого скрипту теми в index.html
  # (тест scripts/csp-hash.test.mjs перевіряє, що він збігається). Сервіс входу на тому ж походженні (/auth),
  # тож connect-src, form-action і frame-src (iframe тихого оновлення) — лише 'self'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qRoFmikCNcZWusgs2S/EJtUld9ZCFif0PU31XI1xO5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # REST і SSE через gateway. Буферизацію вимкнено, щоб події /api/events/stream ішли одразу.
  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # імпорт Excel/DOCX/PDF і фото розпоряджень
    client_max_body_size 25m;
  }

  # Сервіс входу (services/auth): сторінка входу, OIDC, JWKS. Шлях іде без змін (/auth/...), бо auth
  # працює з context-path /auth. Внутрішній API (лише для core в мережі контейнерів) назовні не віддаємо.
  location ^~ /auth/internal/ {
    return 404;
  }

  location = /auth {
    return 302 /auth/login;
  }

  location /auth/ {
    set $auth http://auth:8085;
    proxy_pass $auth;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $rozklad_forwarded_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    # лише справжня адреса клієнта, без значення, яке надіслав сам клієнт
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    access_log /var/log/nginx/access.log rozklad_noquery;
    # CSP, X-Frame-Options і Referrer-Policy сторінок входу ставить сам auth. Власний add_header у цьому location
    # вимикає успадкування заголовків server-рівня: друга CSP (сайту) звузила б form-action сторінки входу
    add_header X-Robots-Tag "noindex" always;
  }

  # Сторінка тихого оновлення входу (login/silent.html): її відкриває прихований iframe самого сайту, тому
  # frame-ancestors 'self' замість 'none'. Власний add_header вимикає заголовки server-рівня — повторюємо їх.
  location = /login/silent.html {
    expires -1;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;
    try_files $uri =404;
  }

  # Стилі сторінки входу (src/styles/auth-page.css): фіксована назва, тому завжди перевіряємо свіжість
  location = /brand/auth.css {
    expires -1;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Файли з хешем у назві не змінюються — кешуємо назавжди
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Карти коду лишаються в образі для налагодження, але не віддаються назовні
  location ~* \.map$ {
    return 404;
  }

  # index.html завжди свіжий, інакше після оновлення браузер вантажив би старі частини коду
  location = /index.html {
    expires -1;
  }

  # SPA: будь-який невідомий шлях віддає index.html, маршрут розбирає React Router. Без $uri/: каталог
  # dist/login (silent.html) інакше перетворив би маршрут /login на переадресацію 301 на /login/
  location / {
    expires 1h;
    try_files $uri /index.html;
  }
}
