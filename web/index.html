<!doctype html>
<html lang="uk" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Розклад ВТФК</title>
    <meta
      name="description"
      content="Розклад занять і заміни Вінницького технічного фахового коледжу: групи, викладачі, аудиторії, дзвінки."
    />
    <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/manrope/files/manrope-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/geologica/files/geologica-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('rozklad.theme');
          var pref = raw ? JSON.parse(raw).state.preference : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <style>
      /* Оболонка до старту (#root нижче): лише те, що потрібно для першого малювання, без стилів застосунку.
         Кольори — ті самі токени теми (src/styles/theme.css), тема — з data-theme, який ставить скрипт вище. */
      :root {
        --boot-canvas: oklch(98.5% 0.004 247);
        --boot-ink: oklch(23.5% 0.02 258);
        --boot-brand: oklch(65.3% 0.126 244);
        --boot-skeleton: oklch(94% 0.008 247);
        --boot-gutter: 1rem;
        --boot-bar: 3.5rem;
      }
      :root[data-theme='dark'] {
        --boot-canvas: oklch(17.8% 0.012 256);
        --boot-ink: oklch(95.5% 0.006 247);
        --boot-brand: oklch(74% 0.12 243);
        --boot-skeleton: oklch(26.5% 0.014 256);
      }
      @media (min-width: 400px) { :root { --boot-gutter: 1.25rem; } }
      @media (min-width: 768px) { :root { --boot-gutter: 2rem; } }
      @media (min-width: 1024px) { :root { --boot-gutter: 3rem; --boot-bar: 4rem; } }
      html { background: var(--boot-canvas); color: var(--boot-ink); }
      body { margin: 0; }
      .boot { min-height: 100dvh; font-family: 'Manrope Variable', system-ui, 'Segoe UI', Roboto, Arial, sans-serif; }
      .boot-bar, .boot-page { box-sizing: border-box; max-width: calc(76rem + 2 * var(--boot-gutter)); margin: 0 auto; padding: 0 var(--boot-gutter); }
      .boot-bar { display: flex; align-items: center; height: var(--boot-bar); border-bottom: 1px solid transparent; }
      .boot-mark { display: inline-flex; align-items: center; gap: 0.625rem; min-height: 2.5rem; margin-inline-start: -0.25rem; padding: 0 0.25rem; }
      .boot-mark svg { display: block; flex-shrink: 0; color: var(--boot-brand); }
      .boot-name { font-size: 0.9375rem; line-height: 1.25rem; font-weight: 700; letter-spacing: -0.005em; white-space: nowrap; }
      .boot-page { display: flex; flex-direction: column; gap: 1rem; padding-top: 1.5rem; }
      @media (min-width: 1024px) { .boot-page { padding-top: 2.5rem; } }
      .boot-line { display: block; height: 2rem; width: 12rem; max-width: 100%; border-radius: 0.375rem; background: var(--boot-skeleton); }
      .boot-line-short { height: 1.25rem; width: 16rem; }
    </style>
  </head>
  <body>
    <!--
      Оболонка до старту застосунку: шапка зі знаком і силует сторінки малюються одразу з HTML і вбудованих
      стилів (boot-* у <head>), ще до завантаження CSS і коду: стилі застосунку не блокують малювання
      (src/app/app-styles.ts). Застосунок замінює оболонку повністю першим рендером, коли код першої сторінки
      й стилі вже є (main.tsx), тож порожнього екрана між оболонкою і сторінкою немає. Розміри — як у
      PublicHeader і Wordmark: знак стоїть на тому ж місці.
    -->
    <div id="root">
      <div class="boot" aria-busy="true">
        <header class="boot-bar">
          <span class="boot-mark">
            <svg viewBox="0 0 26 26" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <circle cx="13" cy="13" r="11.6" />
              <circle cx="13" cy="8.9" r="5.2" />
              <path d="M13 4.2C12.5 10.4 11 16 7.2 21.6 10.6 19.5 15.4 19.5 18.8 21.6 15 16 13.5 10.4 13 4.2Z" />
            </svg>
            <span class="boot-name">Розклад ВТФК</span>
          </span>
        </header>
        <main class="boot-page">
          <span class="boot-line"></span>
          <span class="boot-line boot-line-short"></span>
        </main>
      </div>
    </div>
    <noscript>Для роботи розкладу потрібен увімкнений JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
