# gateway — маршрути з ARCHITECTURE §1; адреси сервісів з env (у compose — імена контейнерів)
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:120s}
          default-filters:
            # Host клієнта (localhost:8080) потрапляє в сервіси → правильні абсолютні Location
            - PreserveHostHeader
            # якщо сервіс колись додасть власні CORS-заголовки, браузер не отримає дублікатів
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE
            # сервіси повертають X-Request-Id, який шлюз уже поставив: лишаємо одне значення шлюзу
            - DedupeResponseHeader=X-Request-Id, RETAIN_FIRST
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:8088}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                exposed-headers: Location,Content-Disposition,X-Request-Id,X-RateLimit-Remaining,X-RateLimit-Replenish-Rate,X-RateLimit-Burst-Capacity
                allow-credentials: false
                max-age: 3600
          # Ліміти за IP (Redis token bucket, ключ — адреса клієнта, у кожного маршруту свій кошик):
          # /api/public/** — PUBLIC_*, анонімні документи розпоряджень — DOCUMENTS_*, решта API — щедрий
          # API_* (людина в кабінеті так не клікає, але цикл з чужим або підробленим токеном зупиниться).
          # Лише SSE /api/events/stream без ліміту: одне довге з'єднання на вкладку.
          # Службові шляхи (/api/internal/** тощо) сюди не доходять: PrivatePathFilter відповідає 404.
          routes:
            - id: importer
              uri: ${IMPORTER_URL:http://localhost:8083}
              predicates:
                - Path=/api/import/**
              filters:
                - name: RequestRateLimiter
                  args: &api-rate-limit
                    key-resolver: "#{@clientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${API_RATE_LIMIT_PER_SECOND:50}
                    redis-rate-limiter.burstCapacity: ${API_RATE_LIMIT_BURST:150}
                    redis-rate-limiter.requestedTokens: 1
            - id: documents
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              predicates:
                - Path=/api/documents/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${DOCUMENTS_RATE_LIMIT_PER_SECOND:10}
                    redis-rate-limiter.burstCapacity: ${DOCUMENTS_RATE_LIMIT_BURST:30}
                    redis-rate-limiter.requestedTokens: 1
            - id: notification
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              predicates:
                - Path=/api/notify/**
              filters:
                - name: RequestRateLimiter
                  args: *api-rate-limit
            - id: scheduler
              uri: ${SCHEDULER_URL:http://localhost:8082}
              predicates:
                - Path=/api/scheduler/**
              filters:
                - name: RequestRateLimiter
                  args: *api-rate-limit
            # SSE: без response-timeout, інакше потік обривався б кожні 120 с
            - id: core-events
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/events/stream
              metadata:
                response-timeout: -1
            - id: core-public
              uri: ${CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/public/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientAddressKeyResolver}"
                    redis-rate-limiter.replenishRate: ${PUBLIC_RATE_LIMIT_PER_SECOND:20}
                    redis-rate-limiter.burstCapacity: ${PUBLIC_RATE_LIMIT_BURST:40}
                    redis-rate-limiter.requestedTokens: 1
            - id: core
              uri: ${CORE_URL:http://localhost:8081}
              order: 100
              predicates:
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args: *api-rate-limit

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # межі декодера Netty вищі за межі RequestHeadFilter (4 КБ адреса, 8 КБ заголовків): запит між
  # ними отримує 414/431 з ProblemDetail, а не порожню відповідь Netty
  max-http-request-header-size: 64KB
  netty:
    max-initial-line-length: 64KB

management:
  endpoints:
    web:
      exposure:
        include: ${GATEWAY_ACTUATOR_EXPOSURE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Розклад ВТФК — gateway

logging:
  level:
    root: INFO
    ua.vtc.rozklad: ${LOG_LEVEL_APP:INFO}
