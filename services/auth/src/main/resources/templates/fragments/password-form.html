<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Форма пароля. secondary=true — коли головна дія «Увійти через Google», а «Увійти» другорядна. -->
<form th:fragment="form(secondary)" class="auth-form" method="post" th:action="@{/login}">
  <div class="auth-field">
    <label for="username">Логін або e-mail</label>
    <input id="username" name="username" class="auth-input" type="text" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="254" required
           th:attr="aria-invalid=${passwordError} ? 'true' : null,
                    aria-describedby=${message != null} ? 'auth-message' : null">
  </div>
  <div class="auth-field">
    <label for="password">Пароль</label>
    <div class="auth-secret">
      <input id="password" name="password" class="auth-input" type="password" autocomplete="current-password"
             maxlength="256" required th:attr="aria-invalid=${passwordError} ? 'true' : null">
      <!-- показати/сховати: кнопку відкриває login.js; без JavaScript вона прихована -->
      <button type="button" class="auth-reveal" aria-controls="password" aria-pressed="false"
              aria-label="Показати пароль" hidden>
        <svg class="auth-icon-show" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="auth-icon-hide" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
          <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
          <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
          <path d="m2 2 20 20"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="auth-actions" th:classappend="${secondary} ? 'auth-actions--row'">
    <button type="submit" class="auth-button"
            th:classappend="${secondary} ? 'auth-button--secondary' : 'auth-button--primary'">Увійти</button>
    <p class="auth-help">Забули пароль? Зверніться до навчальної частини.</p>
  </div>
</form>
</body>
</html>
