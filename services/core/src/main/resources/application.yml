# core — усі значення беруться з env (ARCHITECTURE §7); значення за замовчуванням — для запуску на хості
spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:core}
    username: ${DB_USER:core}
    password: ${DB_PASSWORD:core}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      data-source-properties:
        # повідомлення помилок PostgreSQL без значень рядків і параметрів запиту (коментарі
        # відсутностей, назви): вони потрапляють у журнал Hibernate і в винятки (ARCHITECTURE §10)
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        # order_inserts вимкнено свідомо: між модулями посилання лише за id (без асоціацій),
        # тож Hibernate не знає залежностей FK і міг би вставити дочірні рядки раніше за батьківські
        order_updates: true
  flyway:
    locations: classpath:db/migration
    # модулі мають власні діапазони версій (V1_1xx, V1_4xx, ...) і додають міграції паралельно
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:rozklad}
    password: ${RABBIT_PASSWORD:rozklad}
    # outbox: публікація вважається відправленою лише після підтвердження брокера, а повідомлення без
    # черги-отримувача повертається й стає FAILED (shared.messaging.ConfirmingRabbitTransport)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      # публікація, що зависла (немає підтвердження, процес упав посеред відправлення), стає FAILED,
      # а OutboxResubmitter надсилає її знову, не чекаючи перезапуску
      staleness:
        published: ${OUTBOX_STALE_AFTER:5m}
        processing: ${OUTBOX_STALE_AFTER:5m}
        resubmitted: ${OUTBOX_STALE_AFTER:5m}
      rabbitmq:
        # RabbitTemplate бере наш MessageConverter (Jackson 3 + довірений пакет contracts),
        # а не власний конвертер Modulith без trusted packages
        enable-json: false
  web:
    locale: uk
    locale-resolver: fixed
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          # identity: внутрішній API облікових записів auth (client credentials, scope accounts.manage)
          rozklad-auth-admin:
            provider: rozklad-auth
            client-id: ${CORE_AUTH_CLIENT_ID:rozklad-core}
            client-secret: ${CORE_AUTH_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: accounts.manage
        provider:
          rozklad-auth:
            # з контейнера це http://auth:8085/auth/oauth2/token; iss токена все одно публічний видавець
            token-uri: ${AUTH_TOKEN_URI:http://localhost:8085/auth/oauth2/token}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:5180}
  auth:
    # хто видає токени (iss, сервіс входу auth так, як його бачить браузер) і звідки брати ключі (з контейнера
    # це http://auth:8085/auth/oauth2/jwks); токен має містити audience в aud (обов'язкова: порожня зупиняє старт, токен без неї відхиляється)
    issuer: ${AUTH_ISSUER:http://localhost:8088/auth}
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8085/auth/oauth2/jwks}
    audience: ${AUTH_AUDIENCE:rozklad-api}
  # лише для стенду розробки: «машина часу» (StandClock). at — київський час, напр. 2026-11-20T10:00, з якого
  # годинник домену йде далі; anchor — реальна мить, до якої він прив'язаний (dev-stack.sh up --time ставить
  # одну на всі сервіси). Порожньо — реальний час. З https-видавцем або профілем prod сервіс не стартує
  stand-time:
    at: ${ROZKLAD_STAND_TIME:}
    anchor: ${ROZKLAD_STAND_TIME_ANCHOR:}
  # dev-стенд для телефонів у локальній мережі (scripts/dev-stack.sh up --lan): https-видавець на приватній
  # IPv4-адресі не вважається production, тож час стенду дозволений
  lan-dev: ${ROZKLAD_LAN_DEV:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: Розклад ВТФК — core

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    ua.vtc.rozklad: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

# identity: запрошення викладачів (демо-дані вмикає профіль Spring «demo», див. DemoSeedConfig)
app.identity:
  # термін дії посилання-запрошення (DOMAIN: 7 днів)
  invite-ttl: ${INVITE_TTL:7d}
  # посилання для пароля з «Доступів» змінює пароль будь-якого облікового запису, зокрема адміністратора,
  # тому живе коротше за запрошення
  password-link-ttl: ${PASSWORD_LINK_TTL:24h}
  # облікові записи живуть у сервісі входу auth (внутрішній API, не проксується назовні)
  accounts-api:
    url: ${AUTH_INTERNAL_URL:http://localhost:8085/auth/internal}

# timetable: задача генерації без вістей від планувальника довше за запас вважається збійною
app.timetable:
  generation:
    timeout-grace: ${GENERATION_TIMEOUT_GRACE:10m}
    watchdog-interval: ${GENERATION_WATCHDOG_INTERVAL:PT1M}

# outbox: повтор невдалих публікацій під час роботи й очищення завершених (shared.messaging.OutboxProperties)
app.outbox:
  confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:30s}
  resubmit-interval: ${OUTBOX_RESUBMIT_INTERVAL:1m}
  resubmit-min-age: ${OUTBOX_RESUBMIT_MIN_AGE:30s}
  completed-retention: ${OUTBOX_COMPLETED_RETENTION:7d}

app.substitution:
  # як часто шукати прострочені підтвердження замін, щоб нагадати (DOMAIN §7)
  reminder-check-interval: ${SUBSTITUTION_REMINDER_INTERVAL:PT1M}
