# importer — усі значення з env (ARCHITECTURE §7); значення за замовчуванням — для запуску на хості
spring:
  application:
    name: importer
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:importer}
    username: ${DB_USER:importer}
    password: ${DB_PASSWORD:importer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}
  security:
    oauth2:
      client:
        registration:
          rozklad-service:
            provider: keycloak
            client-id: ${IMPORTER_CLIENT_ID:rozklad-importer}
            client-secret: ${IMPORTER_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # з контейнера це http://keycloak:8080; issuer токена все одно http://localhost:8180/realms/rozklad
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:rozklad}/protocol/openid-connect/token
  web:
    locale: uk
    locale-resolver: fixed
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  keycloak:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/rozklad}
    jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/rozklad/protocol/openid-connect/certs}
  services:
    core-url: ${CORE_URL:http://localhost:8081}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model-text: ${AI_MODEL_TEXT:claude-haiku-5-5}
    model-vision: ${AI_MODEL_VISION:claude-sonnet-5-5}
    daily-budget-usd: ${AI_DAILY_BUDGET_USD:2.00}
  office:
    soffice-path: ${SOFFICE_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN

info:
  app:
    name: Розклад ВТФК — importer

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    ua.vtc.rozklad: ${LOG_LEVEL_APP:INFO}
