<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title th:text="${mail.subject}">Розклад ВТФК</title>
</head>
<!-- A letter of «Розклад ВТФК». Every value is data and goes through th:text / th:href (escaped); no th:utext.
     Inline CSS, table layout up to 600 px, system fonts, no images and no remote resources. -->
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3f4f6;font-size:1px;line-height:1px;" th:text="${mail.preheader}">Preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:8px;">
        <tr>
          <td style="padding:20px 24px 4px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;line-height:18px;font-weight:600;color:#6b7280;">Розклад ВТФК</td>
        </tr>
        <tr>
          <td style="padding:4px 24px 12px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
            <h1 style="margin:0;font-size:20px;line-height:28px;font-weight:700;color:#111827;" th:text="${mail.title}">Заголовок</h1>
          </td>
        </tr>
        <tr th:if="${mail.greeting != null}">
          <td style="padding:0 24px 8px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:22px;color:#111827;" th:text="${mail.greeting}">Добрий день!</td>
        </tr>
        <tr th:each="paragraph : ${mail.intro}">
          <td style="padding:0 24px 8px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:22px;color:#111827;" th:text="${paragraph}">Вступ</td>
        </tr>
        <tr th:if="${not #lists.isEmpty(mail.details)}">
          <td style="padding:8px 24px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;">
              <tr th:each="detail : ${mail.details}">
                <td valign="top" style="padding:6px 12px;width:120px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:20px;color:#6b7280;" th:text="${detail.label}">Поле</td>
                <td th:if="${not mail.struck}" valign="top" style="padding:6px 12px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#111827;" th:text="${detail.value}">Значення</td>
                <td th:if="${mail.struck}" valign="top" style="padding:6px 12px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:20px;color:#6b7280;text-decoration:line-through;" th:text="${detail.value}">Значення</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr th:if="${mail.struck}">
          <td style="padding:0 24px 8px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;line-height:18px;color:#6b7280;">(більше не актуально)</td>
        </tr>
        <tr th:if="${not #lists.isEmpty(mail.items)}">
          <td style="padding:0 24px 8px;">
            <ul style="margin:0;padding:0 0 0 20px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:20px;color:#111827;">
              <li th:each="item : ${mail.items}" style="margin:0 0 4px;" th:text="${item}">Пункт</li>
            </ul>
          </td>
        </tr>
        <tr th:each="paragraph : ${mail.outro}">
          <td style="padding:0 24px 8px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:20px;color:#374151;" th:text="${paragraph}">Що робити</td>
        </tr>
        <tr th:if="${mail.button != null}">
          <td style="padding:12px 24px 8px;">
            <a th:href="${mail.button.url}" th:text="${mail.button.label}"
               style="display:inline-block;padding:10px 18px;background-color:#1d4ed8;border-radius:6px;color:#ffffff;text-decoration:none;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;">Відкрити</a>
          </td>
        </tr>
        <tr th:each="link : ${mail.links}">
          <td style="padding:4px 24px 0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:20px;">
            <a th:href="${link.url}" th:text="${link.label}" style="color:#1d4ed8;">Посилання</a>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 24px 20px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:18px;color:#6b7280;border-top:1px solid #e5e7eb;">
            Цей лист надіслала система «Розклад ВТФК» автоматично. Відповідати на нього не потрібно.<br>
            Налаштувати листи: <a th:href="${mail.settingsUrl}" th:text="${mail.settingsUrl}" style="color:#6b7280;">налаштування</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
