# scheduler — усі значення з env (ARCHITECTURE §7); значення за замовчуванням — для запуску на хості
spring:
  application:
    name: scheduler
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
    hikari:
      data-source-properties:
        # повідомлення помилок PostgreSQL без значень рядків і параметрів запиту: вони потрапляють
        # у журнал Hibernate і у винятки (ARCHITECTURE §10), як у core
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:rozklad}
    password: ${RABBIT_PASSWORD:rozklad}
    # generation.completed чекає підтвердження брокера саме для свого повідомлення (CorrelationData)
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  web:
    locale: uk
    locale-resolver: fixed
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

timefold:
  solver-manager:
    # одночасно розв'язуваних задач; решта чекає в черзі (QUEUED)
    parallel-solver-count: ${SCHEDULER_PARALLEL_SOLVERS:1}
  solver:
    termination:
      # запобіжник: кожна задача задає власний ліміт часу (timeLimitSeconds)
      spent-limit: 15m

app:
  keycloak:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/rozklad}
    jwks-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/rozklad/protocol/openid-connect/certs}
  scheduler:
    progress-interval: ${SCHEDULER_PROGRESS_INTERVAL:2s}
    max-time-limit: ${SCHEDULER_MAX_TIME_LIMIT:15m}
    min-unimproved-limit: ${SCHEDULER_MIN_UNIMPROVED_LIMIT:15s}
    unimproved-ratio: ${SCHEDULER_UNIMPROVED_RATIO:0.25}
    discipline-repeat-weight: ${SCHEDULER_DISCIPLINE_REPEAT_WEIGHT:5}
    completion-resend-interval: 30s
    retention: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN

info:
  app:
    name: Розклад ВТФК — scheduler

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    root: INFO
    ua.vtc.rozklad: ${LOG_LEVEL_APP:INFO}
