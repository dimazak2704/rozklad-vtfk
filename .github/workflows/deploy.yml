# Deploy: on every push to main (or by hand) run CI, build the images for amd64 and arm64 with
# buildx, push them to GHCR and roll them out on the VPS over SSH (infra/deploy/scripts/deploy.sh).
#
# Inert until configured: without the repository secrets VPS_HOST, VPS_USER and VPS_SSH_KEY only
# CI runs. Settings (docs/DEPLOY.md, "GitHub Actions"):
#   secrets   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), optional VPS_PORT, VPS_KNOWN_HOSTS
#   variables DOMAIN (required for images), optional IMAGE_PLATFORMS, VPS_APP_DIR, TELEGRAM_BOT_USERNAME
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  config:
    name: Deployment settings
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      image-prefix: ${{ steps.check.outputs.image-prefix }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          # GHCR wants lower-case names
          echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rozklad" >> "$GITHUB_OUTPUT"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment is off::Add the repository secrets VPS_HOST, VPS_USER and VPS_SSH_KEY to deploy (docs/DEPLOY.md)."
            exit 0
          fi
          if [ -z "$DOMAIN" ]; then
            echo "::error title=DOMAIN is missing::Add the repository variable DOMAIN (same value as DOMAIN in infra/deploy/.env on the VPS)."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  jars:
    name: Jars
    needs: [ci, config]
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # tests already ran in the CI job of this workflow
      - run: mvn -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: services/*/target/app.jar
          retention-days: 1
          if-no-files-found: error

  images:
    name: Image ${{ matrix.service }}
    needs: [config, jars]
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [core, scheduler, importer, notification, gateway, web]
    env:
      # Vite reads these at build time; the SPA talks to /api on its own origin
      WEB_BUILD_ARGS: |
        VITE_API_BASE=/api
        VITE_OIDC_AUTHORITY=https://auth.${{ vars.DOMAIN }}/realms/rozklad
        VITE_OIDC_CLIENT_ID=rozklad-web
        VITE_TELEGRAM_BOT_URL=https://t.me/${{ vars.TELEGRAM_BOT_USERNAME || 'scheduler_vtfk_bot' }}
    steps:
      - uses: actions/checkout@v7

      # the Java Dockerfiles copy target/app.jar from their directory
      - name: Jars
        if: matrix.service != 'web'
        uses: actions/download-artifact@v8
        with:
          name: jars
          path: services

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service == 'web' && 'web' || format('services/{0}', matrix.service) }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ needs.config.outputs.image-prefix }}/${{ matrix.service }}:${{ github.sha }}
            ${{ needs.config.outputs.image-prefix }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.service == 'web' && env.WEB_BUILD_ARGS || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Roll out on the VPS
    needs: [config, images]
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: ${{ vars.VPS_APP_DIR || 'rozklad' }}
    steps:
      - name: SSH key and host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set: trusting the host key ssh-keyscan sees now"
            ssh-keyscan -p "$VPS_PORT" -T 15 "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Pull ${{ github.sha }} on the VPS and restart
        env:
          IMAGE_PREFIX: ${{ needs.config.outputs.image-prefix }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token lets the VPS pull the images while this job runs; it is logged out after.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" \
            "set -e; read -r token; printf '%s' \"\$token\" | docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null; trap 'docker logout ghcr.io >/dev/null' EXIT; cd '$APP_DIR'; IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' bash infra/deploy/scripts/deploy.sh --pull-images"
