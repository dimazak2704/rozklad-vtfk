# Deploy: on every push to main (or by hand) run CI, build the images for amd64 and arm64 with
# buildx, push them to GHCR and roll them out on the VPS over SSH (infra/deploy/scripts/deploy.sh).
# Once a week it does the same for the current main, so security fixes of the base images (JRE,
# nginx, Ubuntu/Alpine packages) reach the server even when nobody pushes.
#
# Inert until configured: without the repository variable DOMAIN only CI runs. Settings
# (docs/DEPLOY.md, "GitHub Actions"):
#   variables DOMAIN (switches deployment on; the deployment URL, checked against the server),
#             optional IMAGE_PLATFORMS, VPS_APP_DIR, TELEGRAM_BOT_USERNAME
#   secrets   VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_KNOWN_HOSTS, optional VPS_PORT,
#             best as secrets of the environment "production" (deployment branch main): only the
#             deploy job, which names that environment, reads them
# Only main is deployed: a manual run on another branch runs CI and nothing else.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC; GitHub pauses it after 60 days without commits

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # SonarCloud's branch analysis of main; nothing else of the caller's secrets
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  config:
    name: Deployment settings
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      image-prefix: ${{ steps.check.outputs.image-prefix }}
    steps:
      # Reads no secret: the VPS secrets may be secrets of the environment "production", which only
      # the deploy job sees (it checks them before connecting).
      - id: check
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          # GHCR wants lower-case names
          echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rozklad" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not deployed::Only main is deployed; $GITHUB_REF ran CI only."
            exit 0
          fi
          if [ -z "$DOMAIN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment is off::Add the repository variable DOMAIN and the VPS secrets to deploy (docs/DEPLOY.md, section 13)."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  jars:
    name: Jars
    needs: [ci, config]
    if: github.ref == 'refs/heads/main' && needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # tests already ran in the CI job of this workflow
      - run: mvn -B -ntp -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: services/*/target/app.jar
          retention-days: 1
          if-no-files-found: error

  images:
    name: Image ${{ matrix.service }}
    needs: [config, jars]
    if: github.ref == 'refs/heads/main' && needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [core, scheduler, importer, notification, gateway, auth, web]
    env:
      # Vite reads these at build time; the SPA talks to /api and signs in at /auth on its own origin,
      # so the image does not depend on the domain
      WEB_BUILD_ARGS: |
        VITE_API_BASE=/api
        VITE_OIDC_CLIENT_ID=rozklad-web
        VITE_TELEGRAM_BOT_URL=https://t.me/${{ vars.TELEGRAM_BOT_USERNAME || 'scheduler_vtfk_bot' }}
    steps:
      - uses: actions/checkout@v7

      # the Java Dockerfiles copy target/app.jar from their directory
      - name: Jars
        if: matrix.service != 'web'
        uses: actions/download-artifact@v8
        with:
          name: jars
          path: services

      # third-party actions are pinned to a commit (Dependabot updates them): this job can push packages
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service == 'web' && 'web' || format('services/{0}', matrix.service) }}
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ needs.config.outputs.image-prefix }}/${{ matrix.service }}:${{ github.sha }}
            ${{ needs.config.outputs.image-prefix }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.service == 'web' && env.WEB_BUILD_ARGS || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Roll out on the VPS
    needs: [config, images]
    if: github.ref == 'refs/heads/main' && needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: ${{ vars.VPS_APP_DIR || 'rozklad' }}
    steps:
      - name: SSH key and host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error title=VPS secrets are missing::DOMAIN is set, so this run deploys: add VPS_HOST, VPS_USER and VPS_SSH_KEY as secrets of the environment production (docs/DEPLOY.md, section 13)."
            exit 1
          fi
          # a runner is new on every run: without a pinned host key it would trust whatever answers
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error title=VPS_KNOWN_HOSTS is missing::Add the secret VPS_KNOWN_HOSTS: the output of ssh-keyscan -t ed25519 <host>, checked against the host key the provider console shows (docs/DEPLOY.md, section 13)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned host key only (the config job requires it), never ssh-keyscan on the runner
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull ${{ github.sha }} on the VPS and restart
        env:
          IMAGE_PREFIX: ${{ needs.config.outputs.image-prefix }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          # Everything travels on stdin. infra/deploy/scripts/ci-entry.sh checks it, compares DOMAIN
          # with the server's .env, logs the server in to GHCR with the job token (valid while this
          # job runs), deploys and logs out. With the forced command of docs/DEPLOY.md the server
          # runs ci-entry.sh whatever command is sent.
          printf '%s\n' "$GITHUB_SHA" "$IMAGE_PREFIX" "$GITHUB_ACTOR" "$GHCR_TOKEN" "$DOMAIN" |
            ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "$VPS_USER@$VPS_HOST" \
              "bash '$APP_DIR/infra/deploy/scripts/ci-entry.sh'"
