# CI: backend (Maven verify: unit tests + Testcontainers integration tests, JaCoCo coverage), web
# (lint, tests with coverage, build), the production deployment config (compose overlay, Caddyfile,
# scripts) and the SonarCloud analysis with its quality gate (sonar-project.properties).
#
# Runs on pull requests and on pushes to branches other than main. For main the Deploy workflow
# calls this one (workflow_call) and rolls out only when it passes, so main is tested exactly once.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Testcontainers uses the Docker engine of the runner (PostgreSQL, RabbitMQ, Redis).
      # JaCoCo records both test runs: target/site/jacoco/jacoco.xml in every module
      - name: Build, unit and integration tests
        run: mvn -B -ntp verify

      # for the SonarCloud job: compiled classes and coverage, not the jars
      - name: Keep classes and coverage for the analysis
        uses: actions/upload-artifact@v7
        with:
          name: backend-analysis
          path: |
            libs/*/target/classes/
            libs/*/target/test-classes/
            libs/*/target/site/jacoco/jacoco.xml
            services/*/target/classes/
            services/*/target/test-classes/
            services/*/target/site/jacoco/jacoco.xml
          retention-days: 3
          if-no-files-found: error

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # the same tests as npm test, with coverage/lcov.info for SonarCloud
      - run: npm run test:coverage
      - run: npm run build

      - name: Keep coverage for the analysis
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 3
          if-no-files-found: error

  deploy-config:
    name: Deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Production compose overlay renders and only Caddy publishes ports
        run: |
          compose() {
            docker compose -f infra/docker-compose.yml -f infra/deploy/compose.prod.yml \
              --env-file infra/deploy/.env.example --profile app "$@"
          }
          compose config --quiet
          compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          published = {n: [p.get("published") for p in s.get("ports", [])] for n, s in services.items() if s.get("ports")}
          print("published ports:", published)
          sys.exit(0 if set(published) == {"caddy"} else 1)'

      - name: Auth trusts forwarding headers only from containers, never from the network gateway
        run: |
          check() {
            docker compose "$@" --profile app config --format json | python3 -c '
          import ipaddress, json, sys
          config = json.load(sys.stdin)
          ipam = config["networks"]["default"]["ipam"]["config"][0]
          trusted = [ipaddress.ip_network(n.strip()) for n in
                     config["services"]["auth"]["environment"]["AUTH_TRUSTED_PROXIES"].split(",")]
          gateway = ipaddress.ip_address(ipam["gateway"])
          containers = ipaddress.ip_network(ipam["ip_range"])
          ports = config["services"]["auth"].get("ports", [])
          print("trusted:", trusted, "gateway:", gateway, "containers:", containers, "auth ports:", ports)
          ok = (not any(gateway in n for n in trusted)
                and all(n.subnet_of(containers) for n in trusted)
                and all(p.get("host_ip") == "127.0.0.1" for p in ports))
          sys.exit(0 if ok else 1)'
          }
          check -f infra/docker-compose.yml
          check -f infra/docker-compose.yml -f infra/deploy/compose.prod.yml --env-file infra/deploy/.env.example

      - name: Caddyfile
        run: |
          docker run --rm -e DOMAIN=rozklad.example.org -e ACME_EMAIL=ci@rozklad.example.org \
            -v "$PWD/infra/deploy/caddy:/etc/caddy:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Shell scripts
        run: |
          for f in infra/deploy/scripts/*.sh infra/deploy/postgres/*.sh infra/deploy/tests/*.sh; do bash -n "$f"; done
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          shellcheck -x -P infra/deploy/scripts infra/deploy/scripts/*.sh infra/deploy/postgres/*.sh
          shellcheck -x -P infra/deploy/tests infra/deploy/tests/*.sh

      # deploy-key checks of ci-entry.sh, Caddy routing in a throwaway container, rendered compose files
      - name: Deployment script and configuration tests
        run: bash infra/deploy/tests/run.sh

  # One SonarCloud project for Java and TypeScript (sonar-project.properties). Pull requests get a PR
  # analysis, pushes a branch analysis (develop; main through the Deploy workflow). The job waits for
  # the quality gate and fails when it is red; only main requires it. Without SONAR_TOKEN (pull requests
  # from forks, Dependabot) it is skipped, not failed.
  sonar:
    name: SonarCloud
    needs: [backend, web]
    # pull requests from this repository, develop and main; a push to a feature branch is analysed in its PR
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
       github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarCloud skipped::The secret SONAR_TOKEN is not available to this run."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          # blame data decides what counts as new code
          fetch-depth: 0

      # the dependency jars for sonar.java.libraries: the Maven cache the backend job restored or saved
      # (same key: the pom files)
      - uses: actions/setup-java@v6
        if: steps.token.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: backend-analysis
          path: .

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: web-coverage
          path: web/coverage

      # Vitest writes paths relative to web/; the analysis runs from the repository root
      - name: Paths in lcov.info
        if: steps.token.outputs.present == 'true'
        run: sed -i 's#^SF:src/#SF:web/src/#' web/coverage/lcov.info

      # pinned to a commit like the other third-party actions (Dependabot updates it)
      - name: SonarCloud scan and quality gate
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.java.libraries=/home/runner/.m2/repository/**/*.jar
