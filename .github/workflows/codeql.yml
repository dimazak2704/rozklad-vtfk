# CodeQL: security and quality queries for the Java services and the TypeScript client. Results go to
# Security → Code scanning. Runs on pull requests and pushes to develop and main, and weekly, so new
# queries reach code nobody touched.
name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "41 3 * * 3" # Wednesdays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.build-mode == 'manual'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # pinned to a commit like the other third-party actions (Dependabot updates it)
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # compiles main and test code of every module; the tests run in the CI workflow
      - name: Build
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests -Djacoco.skip=true test-compile

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
